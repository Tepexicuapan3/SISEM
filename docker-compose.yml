services:
  auth-db:
    image: postgres:16-alpine
    container_name: sisem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Sin "ports:" -> no se expone al host, solo a la red interna.

  expedientes-db:
    image: postgres:16-alpine
    container_name: sisem_postgres_expedientes
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EXPEDIENTES_NAME}
      POSTGRES_USER: ${EXPEDIENTES_USER}
      POSTGRES_PASSWORD: ${EXPEDIENTES_PASSWORD}
    volumes:
      - expedientes_db_data:/var/lib/postgresql/data
      - ./backend/storage/expedientes-ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EXPEDIENTES_USER} -d ${EXPEDIENTES_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # NUEVO: persistimos redis para no perder resultados/colas de Celery
    # ante un reinicio del contenedor.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: sisem-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend,sires-backend,host.docker.internal}
      CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    # NUEVO: si el servidor Oracle está fuera de Docker (on-prem/otra VM)
    # y solo lo resuelves por IP fija en el host, descomenta y ajusta:
    # extra_hosts:
    #   - "oracle-host:10.0.0.5"
    volumes:
      - media_data:/app/media
    depends_on:
      auth-db:
        condition: service_healthy
      expedientes-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery-worker:
    image: sisem-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sisem_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file:
      - .env
    environment:
      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend,sires-backend,host.docker.internal}
      CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    # extra_hosts:
    #   - "oracle-host:10.0.0.5"
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # NUEVO: healthcheck real de Celery en vez de solo "depends_on".
    # Sin esto, docker no sabe si el worker se cayó silenciosamente.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  celery-beat:
    image: sisem-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sisem_celery_beat
    restart: unless-stopped
    # NUEVO: --schedule apunta a un archivo dentro de un volumen persistente.
    # Si no persistes esto, cada vez que el contenedor se recrea, beat
    # "olvida" cuándo corrió la tarea por última vez y puede saltarse
    # o re-disparar ejecuciones de forma inconsistente.
    command: celery -A config beat -l info --schedule=/data/celerybeat-schedule
    env_file:
      - .env
    environment:
      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend,sires-backend,host.docker.internal}
      CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    volumes:
      - celery_beat_data:/data
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # NUEVO: sin esto, celery-beat hereda el HEALTHCHECK del Dockerfile
    # (curl http://localhost:5000/health), pensado para el proceso daphne
    # del servicio "backend". Beat no expone HTTP en el puerto 5000 -> ese
    # check falla siempre y el contenedor queda "unhealthy" aunque el
    # scheduler funcione bien (mismo criterio que ya se aplicó en
    # celery-worker de abajo, con "celery inspect ping"). Acá se valida
    # que el archivo de schedule se siga reescribiendo -- proxy de "beat
    # sigue vivo y tickeando". 600s de margen porque el loop por defecto
    # de Celery puede tardar hasta ~5 min entre sincronizaciones sin
    # tareas pendientes.
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /data/celerybeat-schedule 2>/dev/null || echo 0) )) -lt 600"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_APP_VERSION: ${VITE_APP_VERSION}
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-30000}
    restart: unless-stopped
    depends_on:
      - backend

  # Portal de autoservicio "Citas en Línea" (Fase F5). Proyecto frontend
  # separado (./portal-citas-frontend) que se sirve desde un dominio propio
  # (ver nginx/proxy.conf), pero consume el MISMO backend Django que el
  # sistema interno -> no tiene su propio servicio de API.
  # Sin "ports:" -> no se expone al host, solo es alcanzable a través de "proxy".
  portal-frontend:
    build:
      context: ./portal-citas-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PORTAL_VITE_API_URL:-/api/v1}
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    container_name: sisem_proxy
    restart: unless-stopped
    # Sin "ports:" -> no se publica al host. El único punto de entrada
    # al servidor es el gateway externo (repo ngnix-gateway), que llega
    # hasta acá por nombre de contenedor a través de "proxy_network".
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
    networks:
      - default
      - proxy_network
    depends_on:
      - backend
      - frontend
      - portal-frontend

volumes:
  auth_db_data:
  expedientes_db_data:
  redis_data:            # ← NUEVO
  celery_beat_data:      # ← NUEVO
  media_data:            # ← NUEVO (anuncios-portal-citas): flyers subidos, compartido backend(rw)/proxy(ro)

networks:
  default: {}
  proxy_network:
    external: true